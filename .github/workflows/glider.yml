name: glider-cycle
on:
  schedule:
    - cron: "30 19 * * 1-5"   # 15:30 ET during EDT (20:30 UTC after Nov 1 — or use the cron-job.org bell-ringer)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no orders)"
        type: boolean
        default: false

concurrency:
  group: arena-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run GLIDER cycle
        env:
          GLIDER_API_KEY: ${{ secrets.GLIDER_API_KEY }}
          GLIDER_API_SECRET: ${{ secrets.GLIDER_API_SECRET }}
        run: |
          python run_cycle.py --bot glider ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Refresh dashboard
        if: always()
        run: python dashboard.py || true
      - name: Commit journal + state
        if: always()
        run: |
          git config user.name "glider-bot"
          git config user.email "bots@arena.local"
          git add journal state reports || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "glider cycle $(date -u +%Y%m%d-%H%M)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1
