name: glider-cycle
on:
  schedule:
    - cron: "30 19 * * 1-5"   # 15:30 ET during EDT (20:30 UTC after Nov 1 — or use the cron-job.org bell-ringer)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no orders)"
        type: boolean
        default: false

concurrency:
  # Own group, per STEWARD's postmortem in steward.yml: GitHub keeps ONE pending
  # run per group and cancels the rest. glider-cycle fires at 19:30 UTC — the
  # same minute as scalpel's last cycle AND the cron-job.org bell-ringer — so in
  # the shared arena-state group the daily GLIDER run could be silently evicted.
  # Concurrent pushes to main are handled by the commit step's rebase-retry loop.
  group: arena-state-glider
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run GLIDER cycle
        env:
          GLIDER_API_KEY: ${{ secrets.GLIDER_API_KEY }}
          GLIDER_API_SECRET: ${{ secrets.GLIDER_API_SECRET }}
          # core/data.py wants DATA_API_KEY or falls back to SCALPEL_API_KEY;
          # alias GLIDER's own pair so this workflow depends on no other bot's secrets
          DATA_API_KEY: ${{ secrets.GLIDER_API_KEY }}
          DATA_API_SECRET: ${{ secrets.GLIDER_API_SECRET }}
        run: |
          python run_cycle.py --bot glider ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Refresh dashboard
        if: always()
        run: python dashboard.py || true
      - name: Publish glider phone page
        if: always()
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: |
          if [ -z "$BOARD_TOKEN" ]; then echo "no BOARD_TOKEN secret; skipping"; exit 0; fi
          python glider_board.py
          git clone --depth 1 "https://x-access-token:${BOARD_TOKEN}@github.com/ccsi9401/bot-arena-board.git" /tmp/boardrepo
          cp board/glider.html /tmp/boardrepo/glider.html
          cd /tmp/boardrepo
          git config user.name "glider-bot"
          git config user.email "bots@arena.local"
          git add glider.html
          git diff --cached --quiet || git commit -m "glider board $(date -u +%Y%m%d-%H%M)"
          git push
      - name: Commit journal + state
        if: always()
        run: |
          git config user.name "glider-bot"
          git config user.email "bots@arena.local"
          git add journal state reports || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "glider cycle $(date -u +%Y%m%d-%H%M)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1
