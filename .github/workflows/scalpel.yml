name: scalpel-cycle
on:
  # LAUNCH DAY: remove the leading "#" from the next two lines to go live
  # schedule:
  #   - cron: "30 14-19 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no orders)"
        type: boolean
        default: false

concurrency:
  group: arena-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run SCALPEL cycle
        env:
          SCALPEL_API_KEY: ${{ secrets.SCALPEL_API_KEY }}
          SCALPEL_API_SECRET: ${{ secrets.SCALPEL_API_SECRET }}
        run: |
          python run_cycle.py --bot scalpel ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Refresh dashboard
        if: always()
        run: python dashboard.py || true
      - name: Commit journal + state
        if: always()
        run: |
          git config user.name "scalpel-bot"
          git config user.email "bots@arena.local"
          git add journal state reports || true
          git diff --cached --quiet || git commit -m "scalpel cycle $(date -u +%Y%m%d-%H%M)"
          git pull --rebase origin main && git push
