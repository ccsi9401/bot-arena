name: nightly-scoreboard
on:
  schedule:
    # re-armed 2026-08-31: repo crons went silent after 8/29 03:09Z (workflows active, dispatch OK, no GH incident) — a workflow-file edit re-registers the schedule
    - cron: "15 21 * * *"     # 17:15 ET daily -- the crypto bots trade weekends too
  workflow_dispatch:

concurrency:
  group: arena-state
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update scoreboard
        env:
          # READ-ONLY scoring: account() and positions() only, never an order.
          TALON_API_KEY: ${{ secrets.TALON_API_KEY }}
          TALON_API_SECRET: ${{ secrets.TALON_API_SECRET }}
          PAWL_API_KEY: ${{ secrets.PAWL_API_KEY }}
          PAWL_API_SECRET: ${{ secrets.PAWL_API_SECRET }}
          TWINCOIN_API_KEY: ${{ secrets.TWINCOIN_API_KEY }}
          TWINCOIN_API_SECRET: ${{ secrets.TWINCOIN_API_SECRET }}
          GLIDER_API_KEY: ${{ secrets.GLIDER_API_KEY }}
          GLIDER_API_SECRET: ${{ secrets.GLIDER_API_SECRET }}
          STEWARD_API_KEY: ${{ secrets.STEWARD_API_KEY }}
          STEWARD_API_SECRET: ${{ secrets.STEWARD_API_SECRET }}
        run: |
          python scoreboard.py
          python dashboard.py
      - name: Publish mobile board (GitHub Pages repo)
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: |
          if [ -z "$BOARD_TOKEN" ]; then echo "no BOARD_TOKEN secret; skipping board publish"; exit 0; fi
          python board.py
          git clone --depth 1 "https://x-access-token:${BOARD_TOKEN}@github.com/ccsi9401/bot-arena-board.git" /tmp/boardrepo
          cp board/index.html /tmp/boardrepo/index.html
          cd /tmp/boardrepo
          git config user.name "scorekeeper"
          git config user.email "bots@arena.local"
          git add index.html
          git diff --cached --quiet || git commit -m "board $(date -u +%Y%m%d-%H%M)"
          git push
      - name: Commit
        run: |
          git config user.name "scorekeeper"
          git config user.email "bots@arena.local"
          git add reports state || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "scoreboard $(date -u +%Y%m%d)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1
