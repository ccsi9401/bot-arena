name: steward-backtest
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history; shallow clones cause phantom add/add conflicts
      - name: Place steward files from steward_package (first run only)
        run: |
          if [ -d steward_package ]; then
            [ -f run_steward.py ] || cp steward_package/run_steward.py .
            [ -f steward_report.py ] || cp steward_package/steward_report.py .
            [ -f config/steward.yaml ] || cp steward_package/config/steward.yaml config/
            [ -d bots/portfolio ] || cp -r steward_package/bots/portfolio bots/
            [ -f backtest/steward_backtest.py ] || cp steward_package/backtest/steward_backtest.py backtest/
            [ -f tests/test_steward.py ] || cp steward_package/tests/test_steward.py tests/
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt yfinance pyarrow
      - name: Offline steward tests
        run: python -m tests.test_steward
      - name: Backtest the portfolio strategy (launch gate)
        run: python backtest/steward_backtest.py
      - name: Write gate marker (only reached on success)
        run: |
          mkdir -p state/steward
          echo '{"passed": true, "granted_utc": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}' > state/steward/gate.json
      - name: Commit placed files + reports + gate
        if: always()
        run: |
          git config user.name "backtester"
          git config user.email "bots@arena.local"
          git add run_steward.py steward_report.py config/steward.yaml bots/portfolio \
                  backtest/steward_backtest.py tests/test_steward.py reports state || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "steward: place files + backtest validation $(date -u +%Y%m%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" \
              && git push origin "HEAD:$GITHUB_REF_NAME" \
              && { echo "pushed to $GITHUB_REF_NAME"; exit 0; }
            echo "push attempt $i failed; retrying"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
