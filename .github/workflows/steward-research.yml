name: steward-research
# Manual only, on purpose. This answers "is the edge real?", not "may STEWARD trade?" —
# it writes no gate marker, places no orders, and touches no state. Nothing schedules it
# because there is nothing here that needs to happen on a cadence.
on:
  workflow_dispatch:

concurrency:
  group: arena-state
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # seven full replays of the whole backtest_period window
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # full history; shallow clones cause phantom add/add conflicts
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt yfinance pyarrow
      - name: Run the variant sweep
        run: python backtest/steward_research.py
      - name: Show the comparison in the run summary
        if: always()
        run: |
          if [ -f reports/backtest/steward_research.md ]; then
            cat reports/backtest/steward_research.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No research report produced — check the step above." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit the report
        if: always()
        run: |
          git config user.name "researcher"
          git config user.email "bots@arena.local"
          git add reports/backtest || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "steward research $(date -u +%Y%m%d-%H%M)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1
