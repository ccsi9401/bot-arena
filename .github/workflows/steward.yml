name: steward
on:
  schedule:
    - cron: "0 19 * * 5"     # Friday 15:00 ET — weekly rebalance (1h buffer before the close; GitHub cron can run late)
    - cron: "25 21 * * 1-5"  # weekdays 17:25 ET — nightly pulse (snapshot + report)
  workflow_dispatch:
    inputs:
      mode:
        description: "cycle (rebalance) or pulse (snapshot only)"
        type: choice
        options: [pulse, cycle]
        default: pulse
      dry_run:
        description: "Dry run (plan only, no orders)"
        type: boolean
        default: false

concurrency:
  group: arena-state
  cancel-in-progress: false

jobs:
  steward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run STEWARD
        env:
          STEWARD_API_KEY: ${{ secrets.STEWARD_API_KEY }}
          STEWARD_API_SECRET: ${{ secrets.STEWARD_API_SECRET }}
          DATA_API_KEY: ${{ secrets.STEWARD_API_KEY }}
          DATA_API_SECRET: ${{ secrets.STEWARD_API_SECRET }}
        run: |
          MODE="${{ inputs.mode }}"
          DRY="${{ inputs.dry_run && '--dry-run' || '' }}"
          if [ -z "$MODE" ]; then
            # Friday afternoon (delay-tolerant): hour 19 OR 20 UTC counts as the
            # weekly cycle — GitHub cron regularly fires 20-40 min late, and on
            # Aug 7 that turned the first cycle into a pulse. Anything else: pulse.
            H="$(date -u +%H)"
            if [ "$(date -u +%u)" = "5" ] && { [ "$H" = "19" ] || [ "$H" = "20" ]; }; then
              MODE=cycle
            else
              MODE=pulse
            fi
          fi
          echo "mode=$MODE"
          python run_steward.py --mode "$MODE" $DRY
      - name: Publish steward phone page
        if: always()
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: |
          if [ -z "$BOARD_TOKEN" ]; then echo "no BOARD_TOKEN secret; skipping"; exit 0; fi
          python steward_board.py
          git clone --depth 1 "https://x-access-token:${BOARD_TOKEN}@github.com/ccsi9401/bot-arena-board.git" /tmp/boardrepo
          cp board/steward.html /tmp/boardrepo/steward.html
          cd /tmp/boardrepo
          git config user.name "steward-bot"
          git config user.email "bots@arena.local"
          git add steward.html
          git diff --cached --quiet || git commit -m "steward board $(date -u +%Y%m%d-%H%M)"
          git push
      - name: Commit journal + state + reports
        if: always()
        run: |
          git config user.name "steward-bot"
          git config user.email "bots@arena.local"
          git add journal state reports || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "steward $(date -u +%Y%m%d-%H%M)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1
