name: steward
on:
  schedule:
    # re-armed 2026-08-31: repo crons went silent after 8/29 03:09Z (workflows active, dispatch OK, no GH incident) — a workflow-file edit re-registers the schedule
    # The bot decides cycle-vs-pulse from state, not from the clock — these are
    # just opportunities to run. Two independent faults cost 3 of 5 cycles: the
    # concurrency-group eviction described below (the primary one — it killed runs
    # before they started), and the old "Friday, UTC hour 19 or 20" mode test,
    # which gave a 59-minute window per week because hour 20 UTC is past the 16:00
    # ET close. Either alone was enough to lose a rebalance silently.
    # Times are also de-conflicted from the other bots. Even with a private
    # concurrency group these all push to main, and the fewer simultaneous pushes
    # the less the rebase-retry loop has to earn its keep. Avoid scalpel's
    # "30 14-19 * * 1-5" and the scoreboard's "15 21 * * 1-5".
    - cron: "0 19 * * 5"     # Friday 15:00 ET — the scheduled weekly rebalance slot
    - cron: "50 14 * * 1-5"  # weekdays 10:50 ET — catchup: acts only on a MISSED cycle
    - cron: "45 21 * * 1-5"  # weekdays 17:45 ET — nightly pulse (snapshot + report)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (decide from state) · catchup · cycle (force) · pulse"
        type: choice
        options: [auto, catchup, cycle, pulse]
        default: auto
      dry_run:
        description: "Dry run (plan only, no orders)"
        type: boolean
        default: false

concurrency:
  # STEWARD gets its OWN group. It used to share `arena-state` with scalpel,
  # scoreboard and steward-research — and GitHub permits exactly one PENDING run
  # per group: when a run queues behind an in-progress one, the previously pending
  # run is CANCELLED. Scalpel runs six times a day (30 14-19), the scoreboard at
  # 15 21; STEWARD runs weekly. It was the low-frequency workflow in a group owned
  # by a high-frequency one, so it kept getting evicted from the queue before
  # Python ever started — which is why a missed cycle left no journal folder AND
  # no steward_error_*.json: there was nothing running to write one.
  #
  # The shared group was protecting against concurrent pushes to main. That job is
  # already done properly by the commit step's `git pull --rebase -X theirs` retry
  # loop (hardened 2026-08-07). Belt-and-braces cost us the trousers.
  group: arena-state-steward
  cancel-in-progress: false

jobs:
  steward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run STEWARD
        env:
          STEWARD_API_KEY: ${{ secrets.STEWARD_API_KEY }}
          STEWARD_API_SECRET: ${{ secrets.STEWARD_API_SECRET }}
          DATA_API_KEY: ${{ secrets.STEWARD_API_KEY }}
          DATA_API_SECRET: ${{ secrets.STEWARD_API_SECRET }}
        run: |
          MODE="${{ inputs.mode }}"
          DRY="${{ inputs.dry_run && '--dry-run' || '' }}"
          if [ -z "$MODE" ]; then
            # Which cron woke us decides only which QUESTION to ask; whether a
            # rebalance actually happens is settled in Python against recorded
            # state, where it is testable and immune to cron drift.
            case "${{ github.event.schedule }}" in
              "0 19 * * 5")    MODE=auto ;;     # Friday slot: rebalance if still due
              "50 14 * * 1-5") MODE=catchup ;;  # morning: only if a cycle was MISSED
              *)               MODE=pulse ;;    # evening: snapshot only
            esac
          fi
          echo "requested mode=$MODE (schedule='${{ github.event.schedule }}')"
          python run_steward.py --mode "$MODE" $DRY
      - name: Publish steward phone page
        if: always()
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: |
          if [ -z "$BOARD_TOKEN" ]; then echo "no BOARD_TOKEN secret; skipping"; exit 0; fi
          python steward_board.py
          git clone --depth 1 "https://x-access-token:${BOARD_TOKEN}@github.com/ccsi9401/bot-arena-board.git" /tmp/boardrepo
          cp board/steward.html /tmp/boardrepo/steward.html
          cd /tmp/boardrepo
          git config user.name "steward-bot"
          git config user.email "bots@arena.local"
          git add steward.html
          git diff --cached --quiet || git commit -m "steward board $(date -u +%Y%m%d-%H%M)"
          git push
      - name: Commit journal + state + reports
        if: always()
        run: |
          git config user.name "steward-bot"
          git config user.email "bots@arena.local"
          git add journal state reports || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "steward $(date -u +%Y%m%d-%H%M)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1
