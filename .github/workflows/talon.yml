name: talon
# TALON — long-only crypto ensemble with a rising floor, Alpaca PAPER only.
# Crypto trades 24/7, so the cycle runs every four hours. The bot itself is
# idempotent: exits before entries, state-driven, and it refuses to place any
# order unless state/talon/gate.json says passed=true (written only by a green
# backtest/backtest.py run on real bars).
on:
  schedule:
    - cron: "5 0,4,8,12,16,20 * * *"   # six cycles a day, five past the hour (de-conflicted from the others)
  workflow_dispatch:
    inputs:
      mode:
        description: "cycle (trade) · pulse (read-only, prints intended actions) · flatten (close all, keep floor state)"
        type: choice
        options: [cycle, pulse, flatten]
        default: cycle

concurrency:
  # Own group, per STEWARD's postmortem in steward.yml: GitHub keeps ONE pending run
  # per group and cancels the rest, so sharing a group with a higher-frequency bot
  # silently evicts runs. Concurrent pushes to main are handled by the commit step's
  # fetch + rebase retry loop, not by the concurrency group.
  group: talon
  cancel-in-progress: false

jobs:
  talon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the backtest gate
        id: gate
        # run_talon.py exits 2 when the gate is not passed, which is the right answer for a
        # human at a terminal but turns every scheduled run red until the gate is earned:
        # six failure emails a day that teach you to ignore the one that matters. STEWARD's
        # convention is to skip green and say why; this step does the same for TALON.
        # pulse and flatten are not gated and always run.
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=cycle; fi   # scheduled runs trade
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "requested mode=$MODE (event=${{ github.event_name }})"
          if [ "$MODE" != "cycle" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if python -c "import json,sys,yaml; c=yaml.safe_load(open('config/talon.yaml')); p=c['paths']['gate']; g=json.load(open(p)); print(p, '->', 'passed' if g.get('passed') else 'NOT passed', '-', g.get('reason','')); sys.exit(0 if g.get('passed') else 1)"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=TALON gated::backtest gate not passed; cycle skipped. Run backtest/backtest.py on real bars and commit state/talon/gate.json to enable trading."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run TALON
        if: steps.gate.outputs.skip != 'true'
        env:
          TALON_API_KEY: ${{ secrets.TALON_API_KEY }}
          TALON_API_SECRET: ${{ secrets.TALON_API_SECRET }}
          # TALON_FORCE_LIVE is deliberately NOT set here. Even if config ever said
          # mode: live, the broker would refuse without it (two independent switches).
        run: python run_talon.py --mode "${{ steps.gate.outputs.mode }}"
      - name: Publish talon phone page
        # Same pattern as glider/steward: render from committed files, push to the public
        # bot-arena-board Pages repo. always(): the page must update even on a gated skip,
        # because "gated" is exactly what it needs to say.
        if: always()
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: |
          if [ -z "$BOARD_TOKEN" ]; then echo "no BOARD_TOKEN secret; skipping"; exit 0; fi
          python talon_board.py
          git clone --depth 1 "https://x-access-token:${BOARD_TOKEN}@github.com/ccsi9401/bot-arena-board.git" /tmp/boardrepo
          cp board/talon.html /tmp/boardrepo/talon.html
          cd /tmp/boardrepo
          git config user.name "talon-bot"
          git config user.email "bots@arena.local"
          git add talon.html
          git diff --cached --quiet || git commit -m "talon board $(date -u +%Y%m%d-%H%M)"
          git push
      - name: Commit state + journal
        # always(): a failed cycle still records what happened (journal/talon/*.jsonl
        # gets the error row, state keeps the last good snapshot).
        if: always()
        run: |
          git config user.name "talon-bot"
          git config user.email "bots@arena.local"
          git add state journal || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "talon ${{ inputs.mode || 'cycle' }} $(date -u +%Y%m%d-%H%M)"
          # Concurrent cycles (scalpel, glider, steward, scoreboard all push to main)
          # lose journal writes to stale checkouts without this: fetch, replay our
          # commit on top of whatever landed, push, retry up to 5 times.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
