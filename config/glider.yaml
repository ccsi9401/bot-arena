# GLIDER — swing trend-pullback bot (self-learning, gated)
bot: glider
execution_broker: alpaca
account_env_prefix: GLIDER           # GLIDER_API_KEY / GLIDER_API_SECRET
starting_equity: 5000                # run 1: $5k, work up as it earns it

schedule:
  cycles_et: ["15:30"]

strategy:
  regime_filter: spy_above_200sma    # no new entries in bear regime. markov2 (core/markov2.py) remains supported but was REMOVED from the learner grid 2026-09-06: its 2026-08-29 promotion was an immature-matrix artifact (10y: +19% vs +105% with the 200SMA gate)
  markov2_min_signal: 0.0            # markov2 gate opens when signal > this (range -1..+1)
  sma_fast: 50
  sma_slow: 200
  max_pct_below_52wk_high: 15        # learnable
  pullback_rsi2_max: 5              # learnable — RSI(2) < X, OR touch of 20EMA
  ema_touch_period: 20
  atr_period: 14
  stop_atr_mult: 3.0                 # learnable — initial stop distance
  exit_mode: trail                  # learnable — "target" (fixed R) or "trail" (chandelier)
  target_r_mult: 2.0                 # learnable — used when exit_mode: target
  trail_atr_mult: 3.5                # learnable — used when exit_mode: trail
  trail_target_r_mult: 8.0           # far take-profit leg so the bracket is valid in trail mode
  breakeven_at_r: 1.0                # move stop to breakeven at +1R (both modes)
  max_hold_days: 10                  # learnable
  min_price: 10.0
  min_avg_dollar_vol: 50000000

core_sleeve:                         # idle cash lives in the benchmark ETF (core-satellite), added 2026-09-06
  enabled: true
  symbol: SPY                        # never traded as a pullback setup while the sleeve is on
  mode: always                       # always = fully invested; gated = SPY only while the regime gate is open
  cash_buffer_pct: 1.0               # % of equity kept in cash for limit-fill slippage
  min_order_dollars: 25              # ignore rebalances smaller than this
  slippage_bps: 1                    # backtest only: per-leg cost on the SPY sweep (penny spread on a $700 ETF)

risk:
  risk_per_trade_pct: 0.9            # reflection may scale this (see learning.base_risk_pct)
  max_positions: 5
  max_gross_exposure_pct: 100
  daily_loss_limit_pct: null         # swing bot has no daily breaker
  kill_switch_drawdown_pct: 30.0        # catastrophe line (2026-09-06): fully invested book; 10y replay fires once (Mar 2020), 15-20% would have died Dec 2018
  kill_switch_mode: trailing_peak    # trailing_peak = from the highest equity on record (2026-09-06); from_start = competition rule
  data_freshness_minutes: 60
  limit_price_tolerance_pct: 1.0

learning:
  enabled: true                      # set false to freeze both the learner and reflection
  history_period: 10y                # daily history the learner fetches (10y since 2026-09-06: 5y was short enough to be fooled by one regime)
  holdout_days: 252                  # most recent year is never used for ranking
  min_days_between_changes: 28
  gate_dd_margin_vs_benchmark_pct: 5 # gate: backtest max DD may not exceed SPY's over the same window by more than this (replaces the absolute 15% for a fully invested book)
  max_candidates: 400                # random subset of the grid per run (incumbent always included)
  min_fold_win_frac: 0.67            # must beat incumbent in ≥ 2/3 of calendar-year folds
  noise_floor_sigmas: 1.0            # must beat incumbent Sharpe by ≥ this × bootstrap std
  bootstrap_samples: 300
  base_risk_pct: 0.9                 # reflection restores to this when live matches backtest
  min_live_trades: 30                # reflection does nothing before this many closed trades
  underperform_pctile: 5             # live mean < this pctile of backtest bootstrap → halve risk
