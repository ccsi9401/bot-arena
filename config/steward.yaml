# STEWARD — Claude's portfolio manager (3rd Alpaca paper account)
# Posture: "more than balanced, not too aggressive" — ~70% equities in healthy
# regimes with a permanent defensive ballast; retreats to defense in downtrends.
bot: steward
account_env_prefix: STEWARD          # STEWARD_API_KEY / STEWARD_API_SECRET
starting_equity: 5000               # rung 1 of a graduated ladder (was 50000)

# How much history the backtest fetches. The 252-day momentum lookback plus 30 days
# of warmup consumes the first ~282 trading days, so the TESTED window is roughly
# this minus 1.1 years. At "4y" that left Oct-2023 to Aug-2026 — 2.9 years that begin
# almost exactly at the October 2023 low and contain no bear market at all, which is
# the most flattering possible window for a long-only momentum strategy. "10y" reaches
# back through the 2022 bear and the COVID crash, where the regime gate either earns
# its keep or does not. Check the benchmark's max_drawdown_pct in the report to see
# which regimes actually made it in: about -34% means COVID is included, -25% means 2022.
backtest_period: "10y"
benchmark: SPY

# Self-contained universe (separate from the traders' shared universe on purpose:
# SCALPEL's code and inputs are frozen during Round 1).
universe:
  stocks: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, LLY, JPM, V, XOM,
           UNH, MA, PG, COST, HD, JNJ, ABBV, WMT, NFLX, CRM, BAC, ORCL, CVX,
           MRK, KO, AMD, PEP, ADBE, TMO, LIN, WFC, CSCO, ACN, MCD, ABT, PM,
           IBM, GE, TXN, QCOM, INTU, DHR, CAT, AMGN, VZ, PFE, NEE, DIS, CMCSA,
           RTX, GS, SPGI, HON, UNP, AMAT, LOW, T, BLK, BKNG, ISRG, COP, PANW,
           SBUX, MS, SCHW, NKE, UBER, MU, PLTR, LRCX, INTC, BA]
  index_etfs: [SPY, QQQ]
  defensive_etfs: [IEF, GLD, SHY]     # bonds, gold, T-bills — the ballast

strategy:
  momentum_lookback_days: 252         # 12-month momentum...
  momentum_skip_days: 21              # ...skipping the most recent month (12-1)
  top_n_stocks: 6
  min_price: 10.0
  min_avg_dollar_vol: 50000000
  regime: spy_above_200sma            # risk-on only when SPY > its 200-day SMA
  stock_filter: above_own_200sma_and_positive_momentum
  index_trend_lookback_days: 126      # 6-month momentum splits the index sleeve
  weights:
    risk_on:  {stocks: 0.45, index: 0.25, defensive: 0.20, cash: 0.10}
    risk_off: {stocks: 0.00, index: 0.00, defensive: 0.60, cash: 0.40}
  drift_band_abs: 0.015               # rebalance a position only if >1.5% off target
  cash_drag_band: 0.01                # ...but if TOTAL cash sits >1pp above its target,
                                      # relax the band on buys and put the idle cash back
                                      # to work — many sub-band underweights sum to real drag
  min_order_notional_pct: 0.0005      # skip dust orders when that sweep runs — as a
                                      # FRACTION of equity, not dollars. $2.50 at $5k,
                                      # $25 at $50k: identical behaviour at any size.

risk:
  max_position_weight: 0.12           # no single holding above 12%
  max_equity_weight: 0.75             # stocks + index ETFs capped at 75%
  min_cash_weight: 0.05
  kill_switch_drawdown_pct: 20.0      # -20% from the ORIGINAL $50k: a hard floor.
                                      # Meaningful early; once the book has grown it
                                      # sits so far below the market value that it
                                      # stops being a drawdown guard at all.
  kill_switch_peak_drawdown_pct: 30.0 # -30% off the high-water mark: the measure that
                                      # still means the same thing at any size. Set
                                      # well clear of normal behaviour — the 3y
                                      # validation window's worst peak-to-trough is
                                      # 19.4%, so this is ~10pp of headroom above a
                                      # bad-but-ordinary correction.
