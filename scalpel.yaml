# SCALPEL — intraday session-momentum bot
bot: scalpel
execution_broker: alpaca
account_env_prefix: SCALPEL          # SCALPEL_API_KEY / SCALPEL_API_SECRET
starting_equity: 50000

schedule:
  cycles_et: ["10:30", "11:30", "12:30", "13:30", "14:30", "15:30"]
  last_entry_cycle_et: "14:30"       # 15:30 cycle only liquidates
  liquidate_cycle_et: "15:30"

strategy:
  opening_range_minutes: 60          # first hour high/low
  min_rel_strength_quintile: 0.8     # top 20% RS vs SPY since open
  min_volume_pace: 1.3               # vs 20-day avg for time of day
  require_above_vwap: true
  atr_period: 14
  stop_atr_mult: 1.5
  target_r_mult: 2.0
  min_price: 10.0
  min_avg_dollar_vol: 50000000       # $50M/day

risk:
  risk_per_trade_pct: 1.5
  max_positions: 3
  max_gross_exposure_pct: 100
  daily_loss_limit_pct: 3.0          # halt entries + flatten for the day
  kill_switch_drawdown_pct: 15.0     # from starting equity; permanent halt
  data_freshness_minutes: 20
  limit_price_tolerance_pct: 1.0
